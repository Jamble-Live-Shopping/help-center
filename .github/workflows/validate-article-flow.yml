name: Validate article flow

# Run on every PR so the validate check can be required before merging.
# Only changed articles with flow contracts are validated; the full legacy
# baseline remains a separate maintenance task.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-article-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # beautifulsoup4 required by visible_text rule (PR #117 / Step 2.6).
        run: pip install pyyaml beautifulsoup4

      - name: Validate (PR, changed articles)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python scripts/validate-article-flow.py --changed "$BASE_SHA"

      - name: Summary
        if: always()
        run: |
          echo "## Article flow validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: PR (changed articles only)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Articles without flow.yml are outside this contract check." >> "$GITHUB_STEP_SUMMARY"
