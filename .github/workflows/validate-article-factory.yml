name: Validate article factory

# Run on every PR so the factory check can be required before merging.
# Covers the validator, batch coordinator, historical replay, and initializer.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-article-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # beautifulsoup4 required by validate-article-flow.py's visible_text rule
        # (Step 2.6 / xcstrings_locale_drift gate, PR #117). Soft-degrades to a
        # visible warn if missing, but the regression tests pin the strict
        # behavior — so install it in CI.
        run: pip install pyyaml beautifulsoup4

      - name: Factory regression tests
        run: python3 scripts/test-article-factory.py

      - name: Batch coordinator regression tests
        run: python3 scripts/test-batch-coordinator.py

      - name: Golden replay
        run: python3 scripts/replay-golden-articles.py

      - name: Validate batch example
        run: python3 scripts/validate-article-batch.py process/batches/article-batch.example.yml

      - name: Init flow dry-run
        run: |
          python3 scripts/init-article-flow.py \
            --slug wishlist-and-favorites \
            --from-batch process/batches/article-batch.example.yml \
            --dry-run > /tmp/flow.yml

      - name: Verify init output is valid YAML with workflow=article-v2
        run: |
          python3 - <<'PY'
          import yaml
          data = yaml.safe_load(open("/tmp/flow.yml"))
          assert data["workflow"] == "article-v2", data.get("workflow")
          print("YAML_PARSE_OK")
          PY
