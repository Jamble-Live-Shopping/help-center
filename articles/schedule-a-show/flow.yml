# Flow contract for schedule-a-show. Wave 2 rewrite (2026-10-14).
# See process/templates/article-flow.yml for field documentation.
# See process/00-RUNBOOK.md for the canonical 8-phase workflow.
#
# iOS 5.10.1 replaced the old 4-step wizard (title / tag / cover / details)
# with a single SwiftUI form (CreateShowFormView). The old mockups showed the
# wizard and were removed. Absorbs the former add-and-edit-show-notes
# article (14288162): the "Pinned notes" section of the same form.
# No new mockups in this wave.

workflow: article-v2
mode: v2_rewrite
audience: seller_br

job_to_be_done: "Help sellers schedule a live (cover, title, category, date, repeat, pinned notes) and edit, postpone or delete it before it starts"

source_of_truth:
  ios_files:
    - LIVE_SHOPPING/Create/Show/Views/CreateShowFormView.swift
    - LIVE_SHOPPING/Create/Show/ViewModel/CreateShowFormViewModel.swift
    - LIVE_SHOPPING/Create/Show/Views/CreateShowDatePickerView.swift
    - LIVE_SHOPPING/Create/Show/Views/CreateShowCompletedView.swift
    - LIVE_SHOPPING/Audience/View/ShowAudienceViewController.swift
    - LIVE_SHOPPING/Host/View/ShowHostViewController.swift
    - PROFILE/Views/ProfileViewController.swift
    - TABBAR/View/JambleTabBarController.swift
    - RESOURCES/Localizable.xcstrings
  backend_files: []
  legal: []
  support_context: []

content_contract:
  must_answer:
    - "Agendar Categoria Notas fixadas"
  forbidden_terms:
    - "regex:\\bauction\\b"
    - "regex:\\bleil[aã]o\\b"
  must_not_say:
    - "Internal scheduling implementation details"
    - "Backend service names or endpoints"
    - "Exact postpone count (server default, can change per live)"
    - "Fake discount codes in notes examples"

mockup_plan:
  required: false
  screens: []

icons_required: []
icons_fallback_feather: false

currency_required: false
toc_required: false

risk_flags: []
resolved_decisions: []
