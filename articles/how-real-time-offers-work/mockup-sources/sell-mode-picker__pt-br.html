<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.sep { height: 8px; background: #E9EAEF; }
.list { padding: 6px 14px 10px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
.ic { width: 22px; height: 22px; color: #6B7A92; flex-shrink: 0; }
.ic svg { width: 100%; height: 100%; display: block; }
.tx { flex: 1; }
.nm { font-size: 17px; font-weight: 600; line-height: 22px; }
.sb { font-size: 14px; color: #6B7A92; line-height: 19px; margin-top: 2px; }
.rd { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #BDC2CD; flex-shrink: 0; }
.rd.on { border-color: #7E53F8; position: relative; }
.rd.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #7E53F8; }
.fields { display: flex; gap: 10px; padding: 0 0 6px; }
.f { flex: 1; border: 1px solid #DADDE3; border-radius: 10px; padding: 9px 12px; }
.fl { font-size: 12px; color: #6B7A92; }
.fv { font-size: 16px; margin-top: 4px; }
.fv .u { color: #A0A7B7; font-weight: 600; }
</style></head><body><div class="phone">
