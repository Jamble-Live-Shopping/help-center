# Content contract.
content_contract:
  must_answer:
    - "Correios"
    - "Ver Etiqueta"
  forbidden_terms:
    - "Melhor Envio"
    - "Loggi"
    - "Jadlog"
    - "leilão"
    - "auction"
  must_not_say:
    - "Do not claim sellers can self-serve a weight or label edit from the bundle row after the label is purchased; the bundle only exposes the backend-driven action set (Ver Etiqueta, Ver NFe, Adicionar NF, Isentar NF, Adicionar Etiqueta)."
    - "Do not claim sellers can add an external tracking number or use their own Correios label; that entry point is unreachable in iOS 5.10.1."
    - "Do not state label re-issue costs; support handles it case by case."

