<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #172133; }
/* Tokens from UTILS/COMPONENTS/Color/JambleColor.swift: content.primary #172133 (Gray.t900), content.secondary #6B7A91 (t600), content.tertiary #A1A8B8 (t400), content.disabled #BDC2CC (t300), content.brand #7D54F7 (Brand.t500), content.negative #D92E21 (Red.t600), border.primary #BDC2CC, border.secondary #D9DEE3, border.tertiary #E8EBF0, bg.secondary #FAFAFC, jamble.gray.t500 #828CA3 */
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; padding-bottom: 12px; }
/* JambleNavigationBar(isModal: false): back control leading (left_arrow_icon 28pt + 4 padding, -8 leading), title body L semibold */
.top { display: flex; align-items: center; gap: 12px; padding: 16px 16px 0 8px; height: 52px; }
.back { width: 36px; height: 36px; padding: 4px; flex: 0 0 36px; }
.back svg { width: 28px; height: 28px; display: block; }
.nav-title { flex: 1; font-size: 18px; font-weight: 600; line-height: 24px; color: #172133; }
.form { padding-top: 16px; }
.sec { padding: 0 16px; }
.div-m { height: 8px; background: #E8EBF0; margin: 24px 0; }
.div-s { height: 1px; background: #E8EBF0; margin: 16px 16px; }
.ftitle { font-size: 16px; font-weight: 600; color: #172133; line-height: 21px; }
.req { color: #D92E21; font-size: 16px; font-weight: 600; }
/* CreateProductPhotosSectionView */
.photos-head { display: flex; align-items: baseline; justify-content: space-between; }
.rec { font-size: 14px; font-weight: 600; color: #7D54F7; }
.photo-row { display: flex; gap: 8px; margin-top: 8px; height: 110px; overflow: hidden; }
.tile { width: 94px; height: 94px; flex: 0 0 94px; border-radius: 8px; position: relative; overflow: hidden; }
.tile-add { background: #FAFAFC; border: 1px solid #E8EBF0; display: flex; align-items: center; justify-content: center; color: #6B7A91; }
.tile-add svg { width: 18px; height: 18px; }
.ph-a { background: linear-gradient(135deg, #30243B 0%, #7551B8 56%, #E8D7FF 100%); }
.ph-a::after { content: ""; position: absolute; inset: 14px 24px 18px; border-radius: 6px; background: linear-gradient(160deg, #FFFFFF 0%, #CED4E8 100%); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
.ph-b { background: linear-gradient(135deg, #101624 0%, #20385E 55%, #EFCB5F 100%); }
.ph-b::after { content: ""; position: absolute; left: 22px; right: 22px; top: 12px; bottom: 12px; border-radius: 5px; border: 2px solid rgba(255,255,255,.85); background: rgba(255,255,255,.18); }
.xmark { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; z-index: 2; }
.xmark svg { width: 20px; height: 20px; display: block; }
/* FloatingLabelTextField: 56pt min height, radius 8, border.secondary, label XS when floating, M when empty */
.tf { position: relative; min-height: 56px; border: 1px solid #D9DEE3; border-radius: 8px; background: #FFFFFF; }
.tf-label { position: absolute; left: 16px; top: 8px; font-size: 12px; color: #A1A8B8; line-height: 16px; white-space: nowrap; }
.tf-label.empty { top: 18px; font-size: 16px; line-height: 20px; }
.tf-value { padding: 26px 16px 8px; font-size: 16px; color: #172133; line-height: 20px; white-space: nowrap; overflow: hidden; }
.tf-value.num { padding-top: 24px; }
.tf.multi { min-height: 56px; }
.unit { color: #A1A8B8; font-weight: 600; margin-left: 4px; }
.gap8 { height: 8px; }
/* SaleTypeSectionView: rows spaced 24, icon 24 tinted jamble.gray.t500, radio 18 */
.sale-list { display: flex; flex-direction: column; gap: 24px; }
.sale-top { display: flex; align-items: center; gap: 12px; }
.sale-icon { width: 24px; height: 24px; flex: 0 0 24px; }
.sale-icon img { width: 24px; height: 24px; display: block; }
.sale-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sale-title { font-size: 16px; font-weight: 600; color: #172133; line-height: 21px; }
.sale-subtitle { font-size: 14px; color: #6B7A91; line-height: 18px; }
.radio { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 50%; border: 1.5px solid #BDC2CC; display: flex; align-items: center; justify-content: center; }
.radio.on { border-color: #7D54F7; }
.radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #7D54F7; }
.sale-inputs { display: flex; gap: 12px; margin-top: 8px; }
.sale-inputs .tf { flex: 1; }
/* CreateProductQuantitySectionView: title leading, bordered stepper trailing */
.qty-row { display: flex; align-items: center; gap: 12px; }
.qty-row .ftitle { flex: 1; }
.stepper { display: flex; align-items: center; height: 44px; padding: 0 8px; gap: 8px; border: 1px solid #D9DEE3; border-radius: 8px; }
.step-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.step-btn svg { width: 14px; height: 14px; }
.step-btn.off { color: #BDC2CC; }
.step-btn.onc { color: #172133; }
.vsep { width: 1px; align-self: stretch; background: #D9DEE3; }
.qty-val { width: 40px; text-align: center; font-size: 16px; font-weight: 600; color: #172133; }
/* CreateProductToggleSectionView extended layout: title, then description + switch */
.tg-body { display: flex; align-items: center; gap: 16px; margin-top: 8px; padding-right: 4px; }
.tg-desc { flex: 1; font-size: 14px; color: #6B7A91; line-height: 18px; }
.switch { width: 51px; height: 31px; flex: 0 0 51px; border-radius: 16px; background: #E9E9EB; padding: 2px; display: flex; justify-content: flex-start; }
.switch.on { background: #7D54F7; justify-content: flex-end; }
.switch-dot { width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.24); }
/* CreateProductAttributeRowView: title (+ required asterisk), value below S regular secondary, chevron trailing */
.attr-row { display: flex; align-items: center; min-height: 42px; gap: 8px; }
.attr-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.attr-title { display: flex; gap: 4px; align-items: baseline; }
.attr-value { font-size: 14px; color: #6B7A91; line-height: 18px; }
.chev { width: 18px; height: 19px; flex: 0 0 18px; color: #A1A8B8; }
.chev svg { width: 18px; height: 19px; display: block; }
.save { margin: 16px 16px 0; height: 56px; border-radius: 28px; background: #7D54F7; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
</style></head><body>
<div class="phone">
  <div class="top"><div class="back"><!-- icon: left_arrow_icon, Assets.xcassets/left_arrow_icon.imageset (Frame 33970.svg), template-tinted content.primary --><svg viewBox="0 0 40 40" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M23.3805 31.3726C24.2085 32.2091 25.5519 32.2091 26.3799 31.3726C27.2067 30.5373 27.2067 29.1839 26.3799 28.3486L18.1162 20L26.3799 11.6514C27.2067 10.8161 27.2067 9.4627 26.3799 8.62739C25.5519 7.79087 24.2085 7.79087 23.3805 8.62739L13.6201 18.488C12.7933 19.3233 12.7933 20.6767 13.6201 21.512L23.3805 31.3726Z" fill="#172133"/></svg></div><div class="nav-title">Create New Listing</div></div>
  <div class="form">
    <div class="sec">
    <div class="sale-list">
      <div class="sale-cell sale-auction">
        <div class="sale-top"><div class="sale-icon"><img alt="icon-real-time-offer" src="../../../assets/icons-ios/icon-real-time-offer.svg"></div><div class="sale-copy"><div class="sale-title">Real Time Offer</div><div class="sale-subtitle">The last offer wins when the time runs out.</div></div><div class="radio on"></div></div>
        <div class="sale-inputs"><div class="tf mini-start"><div class="tf-label mini-label">Start at</div><div class="tf-value num">R$ 5</div></div><div class="tf mini-timer"><div class="tf-label mini-label">Timer</div><div class="tf-value num">15<span class="unit">sec</span></div></div></div>
      </div>
      <div class="sale-cell sale-bin">
        <div class="sale-top"><div class="sale-icon"><img alt="sell-mode-buy_it_now" src="../../../assets/icons-ios/sell-mode-buy_it_now.svg"></div><div class="sale-copy"><div class="sale-title">Buy It Now</div><div class="sale-subtitle">Offer a discount on an item during a limited time.</div></div><div class="radio"></div></div>
      </div>
      <div class="sale-cell sale-sd">
        <div class="sale-top"><div class="sale-icon"><img alt="sell-mode-sudden-death" src="../../../assets/icons-ios/sell-mode-sudden-death.svg"></div><div class="sale-copy"><div class="sale-title">Sudden Death</div><div class="sale-subtitle">No added time, even if someone makes an offer.</div></div><div class="radio"></div></div>
      </div>
    </div>
    </div>
    <div class="div-m"></div>
  </div>
  <div class="save">Save</div>
</div></body></html>
