article_slug: how-to-list-products-on-jamble
article_type: v2_rewrite
language_pair: en_pt-br
intercom_id: 14288093
audience:
  primary: seller_br
  secondary: []
intent:
  job_to_be_done: Help sellers create a product listing for a Jamble show using only source-backed fields and labels.
  user_problem: The previous article had broken hierarchy, stale cross-slug images, USD pricing, and over-broad listing claims.
  success_criteria:
    - Seller understands the required listing fields.
    - Seller uses source-backed Brazil pricing with the R$ 5,00 minimum in PT-BR and $5 in EN.
    - Seller understands quantity, pre-offer eligibility, and shipping profile impact.
    - Article uses source-backed mockups for the central listing flow without reusing stale cross-slug images.
source_of_truth:
  # Released apps only: iOS tag 5.11, Android tag v5.11.0, backend origin/main (prod).
  # Since 5.11 the listing form is server-driven: field titles, placeholders, toggle copy and
  # attribute values are served by the backend product builder (get_product_edition_fields),
  # so they are declared below as source=backend. Only chrome and sale-type rows stay in xcstrings.
  code:
    ios_files:
      - PRODUCT/Views/CreateProductViewController.swift
      - PRODUCT/Views/SwiftUI/CreateProductView.swift
      - PRODUCT/Views/SwiftUI/SaleTypeSectionView.swift
      - PRODUCT/Views/SwiftUI/Components/CreateProductPhotosSectionView.swift
      - PRODUCT/Views/SwiftUI/Components/CreateProductFieldTitleView.swift
      - PRODUCT/Views/SwiftUI/Components/CreateProductAttributeRowView.swift
      - PRODUCT/Views/SwiftUI/Components/CreateProductToggleSectionView.swift
      - PRODUCT/Views/SwiftUI/Components/CreateProductQuantitySectionView.swift
      - PRODUCT/View Models/CreateProductViewModel.swift
      - SERVICE/API/Repository/Modules/Product/Model/Response/ProductEditionFieldModels.swift
      - SHIPPING/Add Edit Shipping Address/Views/Components/FloatingLabelTextField.swift
      - UTILS/COMPONENTS/SwiftUI/JambleNavigationBar.swift
      - LIVE_SHOPPING/Show/Model/ShowSaleType.swift
      - EXTENSIONS/Price.swift
    backend_files:
      - jamble_backend/src/services/product_service.py
      - jamble_backend/src/entities/shipping_infos.py
      - jamble_backend/src/entities/item_spec.py
      - jamble_backend/src/product_attributes/configs/attributes/category.json
      - jamble_backend/src/product_attributes/configs/attributes/condition.json
      - jamble_backend/src/product_attributes/configs/attributes/item_type.json
      - jamble_backend/src/product_attributes/configs/categories/pokemon_cards.json
  content:
    existing_articles:
      - articles/how-to-list-products-on-jamble/en.md
      - articles/how-to-list-products-on-jamble/pt-br.md
      - articles/choose-quantities-when-listing-products/flow.yml
      - articles/buy-it-now-sell-at-a-fixed-price/flow.yml
      - articles/pre-offers-let-buyers-place-offers-before-your-show/flow.yml
      - articles/creating-and-managing-real-time-offers/flow.yml
risk_flags:
  - central_seller_workflow
  - sale_mode_labels
  - shipping_profile_claims
resolved_decisions:
  - risk: central_seller_workflow
    decided_by: Aymar batch 3A
    decided_at: '2026-05-13'
    rationale: The article is central, so the stale cross-slug images were replaced with three source-backed listing-flow mockups instead of leaving the article text-only.
  - risk: sale_mode_labels
    decided_by: Aymar batch 3A
    decided_at: '2026-05-12'
    rationale: "User-facing terms follow batch real-2 conventions: Real Time Offer, Oferta em tempo real, Buy It Now, Comprar agora, Pre-Offer, and Pré-oferta."
  - risk: shipping_profile_claims
    decided_by: Aymar batch 3A
    decided_at: '2026-05-12'
    rationale: Shipping guidance is limited to selecting the profile that fits the packaged item and avoids unsourced carrier/cost formulas.
mockup_plan:
  required: true
  rationale: Central seller workflow article. Mockups show the 5.11 server-driven listing form (photos/title/description, sale type and price, quantity/lot/pre-offers/category/shipping) with labels traced to iOS 5.11 xcstrings or the prod backend builder.
  screens:
    - name: listing-basics
      # Layout anchor (iOS 5.11 SwiftUI form):
      #   files: CreateProductView.swift:30-45 (nav bar, isModal false, back control leading), 100-135 (sorted server fields + dividers), 170-178 (photos), 248-268 (text field block), 211-226 (Save button);
      #          CreateProductPhotosSectionView.swift:17-60; FloatingLabelTextField.swift (56pt field, floating XS label, red * when required).
      #   server order (product_service.py get_product_edition_fields): photos(0, media) | title(1) + description(2) (identity) | sale_settings(3).
      #   dividers: medium (8pt full width) between sections, small (1pt inset 16) inside a section.
      #   key placements: photo title leading, "3 recomendadas" trailing brand; add tile first, thumbnails with xmark at top-right;
      #                   "Detalhes do Produto" is the title-field header, the description field has no header.
      #   forbidden layouts: no "Nova listagem rápida" header, no dashed description box, no category row in this block.
      purpose: Show the top of the 5.11 listing form, photos, product title and description, with the Save button.
      source: ios_required
      review_checks:
        - labels_match_xcstrings
        - no_invented_ui_state
        - layout_matches_ios_source
      html_must_contain:
        en:
          - Create New Listing
          - Choose a picture
          - 3 recommended
          - Product Details
          - Title
          - Description
          - Save
        pt-br:
          - Criar Novo Anúncio
          - Selecionar uma Foto
          - 3 recomendadas
          - Detalhes do Produto
          - Título
          - Descrição
          - Salvar
      visible_text:
        - selector: ".photos-title"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2931"
          locale_values:
            en: "Choose a picture"
            pt-br: "Selecionar uma Foto"
        # iOS plural key "%lld recommended" (CreateProductPhotosSectionView.swift:24). The validator only reads
        # stringUnit values, not plural variations, so the resolved plural is declared via locale_values.
        - selector: ".rec"
          source: backend
          path: "PRODUCT/Views/SwiftUI/Components/CreateProductPhotosSectionView.swift:24 (xcstrings plural %lld recommended)"
          locale_values:
            en: "3 recommended"
            pt-br: "3 recomendadas"
        - selector: ".details-title"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2942"
          locale_values:
            en: "Product Details"
            pt-br: "Detalhes do Produto"
        - selector: ".tf-title .ph"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2943"
          locale_values:
            en: "Title"
            pt-br: "Título"
        - selector: ".req"
          source: swift_literal
          path: "PRODUCT/Views/SwiftUI/Components/CreateProductFieldTitleView.swift:15-18"
          value: "*"
        - selector: ".field-value"
          source: user_content
        - selector: ".tf-desc .ph"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2955"
          locale_values:
            en: "Description"
            pt-br: "Descrição"
        - selector: ".save"
          source: xcstrings
          key: "Save"
      visible_text_allowlist:
        - selector: ".nav-title"
          reason: "Title is LocalizedStringKey \"Create New Listing\" (CreateProductView.swift navigationTitle, show context). xcstrings has pt-BR only (Criar Novo Anúncio); EN renders the key itself, which the validator cannot resolve as an en localization."
        - selector: ".xmark"
          reason: Photo remove control is the SF Symbol xmark.circle.fill, icon only.
        - selector: ".tile-add"
          reason: Add-photo tile is the SF Symbol plus, icon only.
    - name: selling-mode-price
      # Layout anchor (iOS 5.11):
      #   files: SaleTypeSectionView.swift:24-31 (types = ShowSaleType.allCases filtered by server allowed_values), 34-56 (rows spaced 24, editor under the selected row),
      #          150-160 (AUCTION editor: Start at + Timer side by side, spacing 12), 228-256 (row: 24pt icon tinted gray.t500, title/subtitle, 18pt radio trailing);
      #          ShowSaleType.swift (titles, subtitles, icons). Server allowed_values for show listings: AUCTION, BUY_IT_NOW, SUDDEN_DEATH (product_service.py:3032-3039).
      #   key placements: radio trailing, editor fields are FloatingLabelTextField, Timer shows unit suffix "seg"/"sec"; default start price is the currency minimum (R$ 5).
      #   forbidden layouts: no "Duração (segundos)" or "Timer (Seconds)" label, no picker modal, no giveaway row.
      purpose: Show the three sale types and the start price and timer fields for Oferta em tempo real.
      source: ios_required
      review_checks:
        - icons_match_ios_source
        - labels_match_xcstrings
        - no_invented_ui_state
        - layout_matches_ios_source
      required_icons:
        - icon-real-time-offer
        - sell-mode-buy_it_now
        - sell-mode-sudden-death
      html_must_contain:
        en:
          - Real Time Offer
          - Buy It Now
          - Sudden Death
          - Start at
          - Timer
        pt-br:
          - Oferta em tempo real
          - Comprar agora
          - Morte súbita
          - Começar em
          - Temporizador
      visible_text:
        - selector: ".sale-auction .sale-title"
          source: xcstrings
          key: "Auction"
        - selector: ".sale-auction .sale-subtitle"
          source: xcstrings
          key: "The last bidder wins at the end of the time."
        - selector: ".sale-auction .mini-start .mini-label"
          source: xcstrings
          key: "Start at"
        - selector: ".sale-auction .mini-timer .mini-label"
          source: xcstrings
          key: "Timer"
        - selector: ".sale-auction .unit"
          source: xcstrings
          key: "sec"
        - selector: ".sale-bin .sale-title"
          source: xcstrings
          key: "Buy It Now"
        - selector: ".sale-bin .sale-subtitle"
          source: xcstrings
          key: "Offer a discount on an item during a limited time."
        - selector: ".sale-sd .sale-title"
          source: xcstrings
          key: "Sudden Death"
        - selector: ".sale-sd .sale-subtitle"
          source: xcstrings
          key: "No added time, even if someone bids. "
        - selector: ".save"
          source: xcstrings
          key: "Save"
      visible_text_allowlist:
        - selector: ".nav-title"
          reason: "Title is LocalizedStringKey \"Create New Listing\" (CreateProductView.swift navigationTitle, show context). xcstrings has pt-BR only (Criar Novo Anúncio); EN renders the key itself, which the validator cannot resolve as an en localization."
        - selector: ".tf-value.num"
          reason: "Default values from SaleTypeSectionView.defaults(for:): starting price = currency minimum (R$ 5, formatted by Price.swift getPriceString) and 15 s timer."
        - selector: ".sale-icon img"
          reason: Icon alt text names source assets for validator anchoring, not user-visible localized copy.
    - name: quantity-shipping
      # Layout anchor (iOS 5.11):
      #   files: CreateProductQuantitySectionView.swift:28-112 (title leading, bordered minus | value | plus stepper trailing);
      #          CreateProductToggleSectionView.swift:44-62 (extended layout: title, then description + switch);
      #          CreateProductAttributeRowView.swift:16-44 (title + red * when required, value below, chevron icon-arrow-right-light trailing).
      #   server order for a Pokémon single card in a show (product_service.py): quantity(4), Lote(5), Ativar pré-ofertas(7) [qty_price] | Categoria(8),
      #   Condição(11), Tipo(12), Perfil de envio (placed right after Tipo) [classification], optional attributes follow.
      #   Pré-ofertas toggle is only served for Oferta em tempo real / Morte súbita with quantity 1 (product_service.py:2886-2905).
      #   Perfil de envio value = "Automático (<peso> · <dimensões>)" from shipping_infos.title_with_parcel + item_spec CARD spec.
      #   forbidden layouts: no "Ativar Pré-oferta?" / "Perfil de remessa" labels, no weight-range shipping value, no carrier/cost formula.
      purpose: Show quantity, lot, pre-offers, category, condition, type and shipping profile in the 5.11 form.
      source: ios_required
      review_checks:
        - labels_match_xcstrings
        - no_invented_ui_state
        - layout_matches_ios_source
      html_must_contain:
        en:
          - Quantity
          - Bundle
          - Enable offers
          - Category
          - Condition
          - Shipping profile
        pt-br:
          - Quantidade
          - Lote
          - Ativar pré-ofertas
          - Categoria
          - Condição
          - Perfil de envio
      visible_text:
        - selector: ".quantity-title"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2980"
          locale_values:
            en: "Quantity"
            pt-br: "Quantidade"
        - selector: ".bundle-title"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2998"
          locale_values:
            en: "Bundle"
            pt-br: "Lote"
        - selector: ".bundle-desc"
          source: backend
          path: "jamble_backend/src/services/product_service.py:2999-3002"
          locale_values:
            en: "Several identical units sold as one listing"
            pt-br: "Várias unidades idênticas vendidas como um único anúncio"
        - selector: ".prebid-title"
          source: backend
          path: "jamble_backend/src/services/product_service.py:3059"
          locale_values:
            en: "Enable offers"
            pt-br: "Ativar pré-ofertas"
        - selector: ".prebid-desc"
          source: backend
          path: "jamble_backend/src/services/product_service.py:3060-3063"
          locale_values:
            en: "Allow users to make offers before the live starts"
            pt-br: "Permitir que usuários façam ofertas antes do início da live"
        - selector: ".row-category .attr-name"
          source: backend
          path: "jamble_backend/src/services/product_service.py:3124"
          locale_values:
            en: "Category"
            pt-br: "Categoria"
        - selector: ".row-category .attr-value"
          source: backend
          path: "jamble_backend/src/product_attributes/configs/attributes/category.json (POKEMON_CARDS)"
          locale_values:
            en: "Pokemon Cards"
            pt-br: "Cartas de Pokémon"
        - selector: ".row-condition .attr-name"
          source: backend
          path: "jamble_backend/src/product_attributes/configs/attributes/condition.json (title)"
          locale_values:
            en: "Condition"
            pt-br: "Condição"
        - selector: ".row-condition .attr-value"
          source: backend
          path: "jamble_backend/src/product_attributes/configs/attributes/condition.json (NEAR_MINT)"
          locale_values:
            en: "Near Mint"
            pt-br: "Quase Mint"
        - selector: ".row-type .attr-name"
          source: backend
          path: "jamble_backend/src/product_attributes/configs/attributes/item_type.json (title)"
          locale_values:
            en: "Type"
            pt-br: "Tipo"
        - selector: ".row-type .attr-value"
          source: backend
          path: "jamble_backend/src/product_attributes/configs/attributes/item_type.json (CARD)"
          locale_values:
            en: "Card"
            pt-br: "Carta Individual"
        - selector: ".row-shipping .attr-name"
          source: backend
          path: "jamble_backend/src/services/product_service.py:3340"
          locale_values:
            en: "Shipping profile"
            pt-br: "Perfil de envio"
        - selector: ".row-shipping .attr-value"
          source: backend
          path: "jamble_backend/src/entities/shipping_infos.py:47-56 + src/entities/item_spec.py:68 (CARD 2 g, 8.8 x 6.3 x 0.05 cm)"
          locale_values:
            en: "Automatic (2 g · 8,8 × 6,3 × 0,05 cm)"
            pt-br: "Automático (2 g · 8,8 × 6,3 × 0,05 cm)"
        - selector: ".req"
          source: swift_literal
          path: "PRODUCT/Views/SwiftUI/Components/CreateProductFieldTitleView.swift:15-18"
          value: "*"
        - selector: ".save"
          source: xcstrings
          key: "Save"
      visible_text_allowlist:
        - selector: ".nav-title"
          reason: "Title is LocalizedStringKey \"Create New Listing\" (CreateProductView.swift navigationTitle, show context). xcstrings has pt-BR only (Criar Novo Anúncio); EN renders the key itself, which the validator cannot resolve as an en localization."
        - selector: ".step-btn"
          reason: Minus/plus are SF Symbol buttons, icon only.
icons_required:
  - icon-real-time-offer
  - sell-mode-buy_it_now
  - sell-mode-sudden-death
validation_contract:
  must_answer:
    en:
      - What fields are required to save a listing?
      - How do selling mode and price work?
      - How do quantity and pre-offers interact?
      - Why does shipping profile matter?
    pt-br:
      - Quais campos são obrigatórios para salvar uma listagem?
      - Como modo de venda e preço funcionam?
      - Como quantidade e pré-ofertas se relacionam?
      - Por que o perfil de envio importa?
  forbidden_claims:
    - Pre-Bid
    - Real-Time Offers
    - Compra Direta
    - Buy It Now products always support Flash Sale
    - photos are required
    - products are always listed within a show
    - $5.00 legacy copy
    - $5,000.00 legacy copy
  toc_required: true
  currency_required: true
audits:
  code: audit/code-audit-14288093.md
  content: audit/content-audit-14288093.md
  compliance: audit/compliance-14288093.md
status: ready_candidate
