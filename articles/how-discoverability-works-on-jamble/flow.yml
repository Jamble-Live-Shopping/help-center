# Flow contract for how-discoverability-works-on-jamble.
# Wave 2 rewrite (2026-10-14): article rewritten against production
# (iOS 5.10.1, Android v5.10.0, backend origin/main). The old three home tabs
# (Ofertas / Explore / Seguir) and the two-tab search (Membros / Shows) no
# longer exist; the article now describes the bottom bar, the server-driven
# home sub-tabs (Para Você / Ao Vivo / categories), the Loja tab, the
# three search tabs (Lives / Produtos / Membros), saved searches and seller tips.
# See process/templates/article-flow.yml for field documentation.

workflow: article-v2
mode: v2_rewrite

# Lives in the seller tools collection: explains to sellers how buyers find
# lives and listings, and what helps them get found.
audience: seller_br

job_to_be_done: "Explain to sellers how buyers find lives, Loja listings and sellers on Jamble (bottom bar, home sections, Loja, search tabs, saved searches, follows) and what helps them get found"

source_of_truth:
  ios_files:
    - TABBAR/View/JambleTabBarController.swift  # bottom bar: Live (pt Ao vivo), Shop (Loja), Activity, Rewards (Ganhos), Profile
    - HOME/View Models/HomeExploreViewModel.swift  # home sub-tabs are server-driven
    - SEARCH/Suggestions/View/SuggestionsPageController.swift  # search tabs Lives / Products / Members
    - SEARCH/Main/Models/SearchScope.swift  # Products scope = marketplace listings
    - SEARCH/Main/Views/SearchView.swift  # Saved searches section (pt Pesquisas salvas)
    - SEARCH/Products/Views/Components/SaveThisSearchView.swift  # Save this search (pt Salvar esta pesquisa)
    - RESOURCES/Localizable.xcstrings
  backend_files:
    - src/routers/homepage.py  # explore sub tabs: Para Você, Ao Vivo (when lives are on), categories
    - src/routers/product.py  # save_search / get_saved_searches live on origin/main
    - src/services/notification_service.py  # Lives de quem eu sigo notification toggle
  legal: []
  support_context:
    - "Android v5.10.0: nav_live=Live, nav_deals=Loja, nav_rewards=Ganhos, nav_profile=Perfil, nav_activity=Atividade; search_tab_lives/products/members = Lives/Produtos/Membros; search_saved_searches_title=Buscas salvas"

content_contract:
  must_answer:
    - "Loja"
    - "Produtos"
    - "Membros"
    - "Para Você"
  forbidden_terms:
    - leilao
    - leilão
    - auction
    - "regex:\\bExplore\\b"
    - "Seguir"
  must_not_say:
    - "Ranking or algorithm weights, numeric boosts or thresholds"
    - "The removed Ofertas / Explore / Seguir home tabs or the old Members / Shows search"
    - "Platform-specific saved-search label as the only name (iOS Pesquisas salvas vs Android Buscas salvas): describe neutrally"

# All three previous mockups showed UI that no longer exists in production
# (old home tabs, two-tab search, removed save-search prompt). They were
# removed in the wave 2 rewrite. No new mockups in this wave.
mockup_plan:
  required: false
  screens: []

icons_required: []
icons_fallback_feather: false

currency_required: false

toc_required: true

risk_flags: []
resolved_decisions: []
