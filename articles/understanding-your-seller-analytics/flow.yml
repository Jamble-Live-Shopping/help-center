# Flow contract for understanding-your-seller-analytics.
# Wave 2 rewrite (2026-10-14) against production (iOS 5.10.1, Android v5.10.0,
# backend origin/main, Website origin/main). The article now covers five real
# surfaces: the Vendas em tempo real overlay, the per-live dashboard (Sua Live,
# RESUMO tiles, now translated in pt-BR), the "Resumo do seu show" DM sent
# after every live, the Seller Hub (Visão Geral / Lives / Vendas) and the
# wallet. The previous "what the app does not have yet" section was removed
# (no statements about missing features), so the old feature-may-not-exist
# risk and negative scan no longer apply.

workflow: article-v2
mode: v2_rewrite
audience: seller_br

intercom_id: 14288160

job_to_be_done: "Show sellers where to read their performance: live overlay, per-live dashboard, post-live summary message, Seller Hub and wallet"

source_of_truth:
  ios_files:
    - LIVE_SHOPPING/Host/View/ShowHostViewController.swift  # Real-Time Sales overlay (~754-797), My Dashboard button (69)
    - LIVE_SHOPPING/DashboardHost/Views/ShowHostDashboardView.swift  # SUMMARY + TOTAL / AFTER FEES / SOLD / BUYERS (123-145)
    - LIVE_SHOPPING/DashboardHost/Views/ShowHostDashboardViewController.swift  # title "Your Show" (pt Sua Live)
    - PROFILE/ProfileSettings/ProfileSettingsV2ViewController.swift  # My Wallet entry
    - RESOURCES/Localizable.xcstrings  # RESUMO, PÓS TAXAS, VENDIDOS, COMPRADORES, Sua Live, Meu painel de controle, Vendas em tempo real, Minha carteira
  backend_files:
    - src/services/message_service.py  # send_show_summary_message / get_show_summary_message_content ("Resumo do seu show")
    - src/services/show_service.py  # summary DM sent at end of every live
    - src/schemas/sale_actions.py  # server dashboard stats TOTAL / APÓS TAXAS / VENDIDOS / COMPRADORES (Android)
  legal: []
  support_context:
    - "Website origin/main src/lib/i18n/messages/console.ts (Visão Geral, Lives, Vendas, Carteira) and dashboard.ts (Painel da live, Pós taxas)"

content_contract:
  must_answer:
    - "Vendas em tempo real"
    - "RESUMO"
    - "Resumo do seu show"
    - "Seller Hub"
  forbidden_terms:
    - "regex:\\bauction\\b"
    - "regex:\\bleil[aã]o\\b"
    # Aymar editorial: the after-fees number is NOT profit.
    - "regex:\\blucro\\b"
    - "regex:\\bprofit\\b"
    - "regex:\\breal take\\b"
    - "regex:\\breal profit\\b"
  must_not_say:
    - "Implementation detail of the dashboard view model"
    - "Backend service names"
    - "Promises about future analytics features (charts, exports, demographics)"
    - "Individual commission rates other than the standard 10%"

mockup_plan:
  required: true
  screens:
    - name: live-realtime-sales
      purpose: "Show the live-show Real-Time Sales overlay top-left: title + running total + price-per-item caption."
      source: ios_required
      review_checks:
        - icons_match_ios_source
        - labels_match_xcstrings
        - no_invented_ui_state
      # Option B (text-only anchor): the overlay is text + numbers only on iOS.
      html_must_not_contain:
        - "<img"
        - "<svg"
        - "icon-"
      html_must_contain:
        pt-br:
          - "Vendas em tempo real"
        en:
          - "Real-Time Sales"
    # post-show-summary (English tile labels, now translated in the app) and
    # wallet-summary (old "Saldo disponivel" / "Sacar" wording) were removed
    # in the wave 2 rewrite because they no longer match the app.

icons_required: []
icons_fallback_feather: false

currency_required: false

toc_required: true

risk_flags: []
resolved_decisions: []
