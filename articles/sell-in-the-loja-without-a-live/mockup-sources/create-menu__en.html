<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.hdr { display:flex; align-items:center; padding:22px 18px 14px; border-bottom:1px solid #F0F1F5; }
.hdr h1 { font-size:26px; font-weight:700; letter-spacing:-0.02em; flex:1; }
.hdr .ic { margin-left:18px; display:flex; }
.prof { position:relative; display:flex; gap:14px; padding:16px 18px 10px; }
.av { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#C7D2FE,#A5B4FC); flex-shrink:0; }
.lines div { height:10px; border-radius:5px; background:#E9EAEF; margin:8px 0; }
.menu { position:absolute; right:14px; top:-6px; width:236px; background:#FFFFFF; border-radius:14px; box-shadow:0 8px 28px rgba(22,34,51,0.16); padding:6px 0; }
.menu div { display:flex; align-items:center; gap:14px; padding:13px 16px; font-size:16px; font-weight:500; }
.chips { display:flex; gap:6px; padding:8px 18px 18px; }
.chips span { border:1px solid #E9EAEF; border-radius:16px; padding:6px 10px; font-size:12px; color:#6B7A92; }
</style></head><body><div class="phone">
