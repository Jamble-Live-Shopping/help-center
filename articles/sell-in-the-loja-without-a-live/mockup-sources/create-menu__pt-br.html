<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.prof { padding:18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #E9EAEF; }
.av { width:52px; height:52px; border-radius:50%; background:#E9EAEF; }
.nm { font-size:17px; font-weight:600; }
.plus { margin-left:auto; width:36px; height:36px; border-radius:50%; background:#7E53F8; color:#FFFFFF; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 4px rgba(126,83,248,0.18); }
.grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; padding:12px; opacity:0.35; }
.grid div { aspect-ratio:1; border-radius:8px; background:#E9EAEF; }
.dim { background:rgba(12,19,29,0.32); padding:14px 12px 12px; }
.sh { background:#FFFFFF; border-radius:16px; overflow:hidden; }
.it { display:flex; align-items:center; gap:12px; padding:15px 16px; font-size:16px; font-weight:500; border-bottom:1px solid #F0F1F5; }
.it:last-child { border-bottom:none; }
.it.hl { background:#F9F8FF; color:#7E53F8; font-weight:600; }
.ic { width:28px; height:28px; border-radius:8px; background:#E9EAEF; display:flex; align-items:center; justify-content:center; color:#6B7A92; }
.it.hl .ic { background:rgba(126,83,248,0.12); color:#7E53F8; }
</style></head><body><div class="phone">
<div class="prof"><div class="av"></div><div><div class="nm">@colecionador</div><div class="muted" style="font-size:13px">Vendedor</div></div><div class="plus"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5V12.5M1.5 7H12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div></div>
<div class="grid"><div></div><div></div><div></div></div>
<div class="dim"><div class="sh"><div class="it"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6" width="13" height="12" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M15.5 10.5L21 7.5V16.5L15.5 13.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>Agendar uma Live</div><div class="it hl"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 4H5.2L7.4 15.2C7.5 15.7 7.9 16 8.4 16H18.2C18.7 16 19.1 15.7 19.2 15.2L20.6 8H6.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5" fill="currentColor"/><circle cx="17.5" cy="20" r="1.5" fill="currentColor"/></svg></div>Criar anúncio na Loja</div></div></div>
</div></body></html>
