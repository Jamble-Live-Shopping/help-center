<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.top { display:flex; align-items:center; padding:14px 16px; border-bottom:1px solid #F0F1F5; }
.top .back { font-size:22px; color:#162233; width:24px; }
.top .mid { flex:1; text-align:center; }
.top .mid b { font-size:17px; display:block; }
.top .mid span { font-size:12px; color:#A0A7B7; }
.top .av { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#FBCFE8,#C084FC); }
.chat { padding:14px 16px; min-height:190px; }
.time { text-align:center; font-size:12px; color:#A0A7B7; margin-bottom:10px; }
.msg { display:inline-block; background:#F0F1F5; border-radius:16px; padding:9px 12px; font-size:14px; margin-bottom:10px; }
.bub { width:250px; border:1px solid #E9EAEF; border-radius:14px; padding:10px 12px; }
.bh { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#6B7A92; margin-bottom:8px; }
.pill { background:#F5A623; color:#FFFFFF; font-weight:600; font-size:12px; border-radius:10px; padding:2px 8px; }
.bp { display:flex; gap:10px; align-items:center; }
.th { width:44px; height:44px; border-radius:8px; background: linear-gradient(135deg,#FCD34D 0%,#F97316 55%,#7E53F8 100%); }
.bp b { font-size:17px; }
.bp s { font-size:12px; color:#A0A7B7; margin-left:4px; }
.bp .n { font-size:13px; color:#6B7A92; }
.bar { border-top:1px solid #E9EAEF; padding:12px 14px 16px; }
.exp { text-align:center; font-size:13px; margin-bottom:10px; }
.exp b { color:#7E53F8; font-weight:600; }
.acts { display:flex; gap:8px; }
.acts .btn { flex:1; height:42px; font-size:14px; }
.btn-dark { background:#0C131D; color:#FFFFFF; }
</style></head><body><div class="phone">
<div class="top"><div class="back">‹</div><div class="mid"><b>@comprador</b><span>Online hoje</span></div><div class="av"></div></div>
<div class="chat"><div class="time">Hoje 09:25</div><div class="msg">Oi! Aceita R$ 16 nessa carta?</div>
<div class="bub"><div class="bh"><span>Oferta</span><span class="pill">Pendente</span></div>
<div class="bp"><div class="th"></div><div><b>R$ 16</b><s>R$ 25</s><div class="n">Pokémon Booster Pack</div></div></div></div></div>
<div class="bar"><div class="exp">A oferta expira em <b>2d 23h 59m</b></div>
<div class="acts"><div class="btn btn-secondary">Recusar</div><div class="btn btn-outline">Contrapor</div><div class="btn btn-dark">Aceitar</div></div></div>
</div></body></html>
