<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.top { padding:14px 16px; border-bottom:1px solid #E9EAEF; font-size:16px; font-weight:600; display:flex; align-items:center; gap:10px; }
.top .av { width:32px; height:32px; border-radius:50%; background:#E9EAEF; }
.wrap { padding:16px; background:#F9FAFC; }
.card { background:#FFFFFF; border:1px solid #E9EAEF; border-radius:14px; padding:14px; }
.badge { display:inline-block; font-size:12px; font-weight:600; color:#C77C0B; background:#FFF6E3; border-radius:10px; padding:3px 8px; margin-bottom:10px; }
.prod { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
.thumb { width:56px; height:56px; border-radius:10px; background: linear-gradient(135deg,#FCD34D 0%,#F97316 55%,#7E53F8 100%); }
.pt { font-size:15px; font-weight:600; line-height:20px; }
.kv { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
.kv b { font-size:16px; }
.exp { font-size:12px; margin:8px 0 12px; }
.acts { display:flex; gap:8px; }
.acts .btn { flex:1; height:38px; font-size:14px; }
</style></head><body><div class="phone">
<div class="top"><div class="av"></div>@comprador</div>
<div class="wrap"><div class="card"><div class="badge">Oferta pendente</div>
<div class="prod"><div class="thumb"></div><div class="pt">Booster Pokémon TCG Escarlate e Violeta</div></div>
<div class="kv"><span class="muted">Preço</span><span>R$ 60,00</span></div>
<div class="kv"><span class="muted">Oferta</span><b>R$ 50,00</b></div>
<div class="exp tert">A oferta expira em 2 dias</div>
<div class="acts"><div class="btn btn-secondary">Recusar</div><div class="btn btn-outline">Contrapor</div><div class="btn btn-brand">Aceitar</div></div></div></div>
</div></body></html>
