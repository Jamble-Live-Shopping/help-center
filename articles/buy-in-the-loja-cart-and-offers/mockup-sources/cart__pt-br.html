<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.top { display:flex; align-items:center; justify-content:space-between; padding:18px 16px 12px; }
.top h1 { font-size:24px; font-weight:700; letter-spacing:-0.01em; }
.x { width:32px; height:32px; border-radius:50%; background:#E9EAEF; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
.box { margin:0 12px 14px; border:1px solid #E9EAEF; border-radius:14px; overflow:hidden; }
.sh { display:flex; align-items:center; gap:10px; padding:12px; border-bottom:1px solid #E9EAEF; }
.sh .av { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#FDE68A,#F59E0B); }
.sh .nm { font-size:15px; font-weight:600; }
.sh .nm span { color:#F5A623; font-weight:500; font-size:13px; }
.sh .hd { font-size:12px; color:#6B7A92; }
.sh .tot { margin-left:auto; text-align:right; font-size:15px; font-weight:600; }
.sh .tot div { font-size:12px; color:#7E53F8; font-weight:600; }
.ln { display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid #F0F1F5; align-items:center; }
.th { width:48px; height:48px; border-radius:8px; flex-shrink:0; }
.li { flex:1; min-width:0; }
.li .t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li b { font-size:15px; }
.li s { font-size:12px; color:#A0A7B7; margin-left:4px; }
.st { display:flex; align-items:center; gap:8px; background:#F0F1F5; border-radius:16px; padding:3px; }
.st i { width:24px; height:24px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center; }
.st span { font-size:13px; font-weight:600; min-width:10px; text-align:center; }
.ft { display:flex; align-items:center; gap:12px; padding:12px; }
.ft .sub { font-size:12px; color:#6B7A92; }
.ft .sub b { display:block; font-size:20px; color:#162233; }
.ft .btn { flex:1; }
.note { font-size:11px; color:#6B7A92; text-align:center; padding:0 12px 12px; }
</style></head><body><div class="phone">
<div class="top"><h1>Carrinho</h1><div class="x">✕</div></div>
<div class="box"><div class="sh"><div class="av"></div><div><div class="nm">@colecionador <span>★ 4,9</span></div><div class="hd">Colecionador TCG</div></div><div class="tot">R$ 130,00<div>3 itens ^</div></div></div>
<div class="ln"><div class="th" style="background: linear-gradient(135deg,#FCD34D 0%,#F97316 55%,#7E53F8 100%);"></div><div class="li"><div class="t">Booster Pokémon TCG Escarlate e Violeta</div><b>R$ 60,00</b><s>R$ 80,00</s></div><div class="st"><i><svg width="12" height="13" viewBox="0 0 12 13"><path d="M1 3H11M4.5 3V1.5H7.5V3M2.5 3L3 12H9L9.5 3" fill="#162233" stroke="#162233" stroke-width="1.2" stroke-linejoin="round"/></svg></i><span>1</span><i><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 2V10M2 6H10" stroke="#162233" stroke-width="2" stroke-linecap="round"/></svg></i></div></div><div class="ln"><div class="th" style="background:linear-gradient(135deg,#93C5FD,#2563EB)"></div><div class="li"><div class="t">Hot Wheels Nissan Skyline GT-R</div><b>R$ 35,00</b><s></s></div><div class="st"><i><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6H10" stroke="#162233" stroke-width="2" stroke-linecap="round"/></svg></i><span>2</span><i><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 2V10M2 6H10" stroke="#162233" stroke-width="2" stroke-linecap="round"/></svg></i></div></div>
<div class="ft"><div class="sub">Subtotal<b>R$ 130</b></div><div class="btn btn-brand">Finalizar compra</div></div>
<div class="note">Ofertas, descontos, frete e taxas são aplicados ao finalizar a compra.</div></div>
</div></body></html>
