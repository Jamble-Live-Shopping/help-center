<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.top { padding:14px 16px; font-size:17px; font-weight:600; border-bottom:1px solid #E9EAEF; }
.grp { padding:14px 16px 4px; }
.sl { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; margin-bottom:10px; }
.sl .av { width:24px; height:24px; border-radius:50%; background:#E9EAEF; }
.line { display:flex; gap:12px; align-items:center; padding:8px 0; }
.th { width:52px; height:52px; border-radius:10px; flex-shrink:0; }
.lt { flex:1; font-size:14px; line-height:19px; }
.lp { font-size:14px; font-weight:600; }
.sum { margin:8px 16px 0; padding-top:12px; border-top:1px solid #E9EAEF; display:flex; justify-content:space-between; font-size:15px; }
.go { padding:14px 16px 16px; }
.note { font-size:12px; text-align:center; margin-top:8px; }
</style></head><body><div class="phone">
<div class="top">Cart</div>
<div class="grp"><div class="sl"><div class="av"></div>@colecionador</div>
<div class="line"><div class="th" style="background: linear-gradient(135deg,#FCD34D 0%,#F97316 55%,#7E53F8 100%);"></div><div class="lt">Booster Pokémon TCG Escarlate e Violeta</div><div class="lp">R$ 60,00</div></div>
<div class="line"><div class="th" style="background:linear-gradient(135deg,#93C5FD,#2563EB)"></div><div class="lt">Hot Wheels Nissan Skyline GT-R</div><div class="lp">R$ 35,00</div></div></div>
<div class="sum"><span class="muted">Subtotal</span><b>R$ 95,00</b></div>
<div class="go"><div class="btn btn-brand">Checkout</div><div class="note tert">Shipping and fees show at checkout</div></div>
</div></body></html>
