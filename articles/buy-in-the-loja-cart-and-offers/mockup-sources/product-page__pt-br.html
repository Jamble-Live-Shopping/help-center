<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.img { height:230px; background: linear-gradient(135deg,#FCD34D 0%,#F97316 55%,#7E53F8 100%); position:relative; }
.img .lbl { position:absolute; left:12px; bottom:12px; background:rgba(255,255,255,0.9); border-radius:8px; padding:4px 8px; font-size:12px; font-weight:600; }
.info { padding:16px; }
.ttl { font-size:18px; font-weight:600; line-height:24px; }
.pr { display:flex; align-items:baseline; gap:8px; margin:8px 0 4px; }
.pr b { font-size:22px; }
.pr s { font-size:14px; color:#A0A7B7; }
.cond { font-size:13px; margin-bottom:14px; }
.seller { display:flex; align-items:center; gap:10px; padding:10px 0 14px; border-top:1px solid #E9EAEF; }
.seller .av { width:32px; height:32px; border-radius:50%; background:#E9EAEF; }
.ctas { display:flex; gap:10px; }
.ctas .btn { flex:1; }
</style></head><body><div class="phone">
<div class="img"><div class="lbl">Loja</div></div>
<div class="info"><div class="ttl">Booster Pokémon TCG Escarlate e Violeta</div>
<div class="pr"><b>R$ 60,00</b><s>R$ 80,00</s></div><div class="cond muted">Condição: Novo</div>
<div class="seller"><div class="av"></div><div style="font-size:14px;font-weight:600">@colecionador</div></div>
<div class="ctas"><div class="btn btn-secondary">Fazer oferta</div><div class="btn btn-brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 4H5.2L7.4 15.2C7.5 15.7 7.9 16 8.4 16H18.2C18.7 16 19.1 15.7 19.2 15.2L20.6 8H6.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5" fill="currentColor"/><circle cx="17.5" cy="20" r="1.5" fill="currentColor"/></svg> Adicionar</div></div></div>
</div></body></html>
