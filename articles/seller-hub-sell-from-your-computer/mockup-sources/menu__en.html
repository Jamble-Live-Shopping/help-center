<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #1C2024; }
.phone { width: 350px; background: #FCFCFD; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E8E8EC; overflow: hidden; position: relative; }

.menu div { display:flex; align-items:center; gap:14px; padding:12px 18px; font-size:15px; }
.bg { padding:16px; height:260px; }
.card { border:1px solid #E0E1E6; border-radius:18px; height:100%; background:#FFFFFF; }
</style></head><body><div class="phone">
