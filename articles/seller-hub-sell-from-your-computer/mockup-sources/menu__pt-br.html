<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.bar { display:flex; align-items:center; gap:8px; padding:10px 14px; background:#F0F0F3; border-bottom:1px solid #E0E1E6; }
.dots span { display:inline-block; width:8px; height:8px; border-radius:50%; background:#CDCED6; margin-right:4px; }
.url { flex:1; background:#FFFFFF; border-radius:8px; padding:5px 10px; font-size:11px; color:#60646C; }
.hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid #E8E8EC; }
.mark { font-size:16px; font-weight:700; letter-spacing:-0.01em; }
.mark b { color:#7E53F8; }
.create { position:relative; }
.create .btn { height:32px; padding:0 12px; font-size:13px; border-radius:16px; }
.drop { position:absolute; right:0; top:38px; width:208px; background:#FFFFFF; border:1px solid #E0E1E6; border-radius:12px; box-shadow:0 8px 24px rgba(28,32,36,0.12); padding:6px; z-index:2; }
.drop div { padding:9px 10px; font-size:13px; border-radius:8px; }
.drop div:first-child { background:rgba(126,83,248,0.08); color:#6326DB; font-weight:600; }
.body { display:flex; min-height:300px; }
.side { width:150px; padding:10px 8px; border-right:1px solid #E8E8EC; background:#FCFCFD; }
.side div { padding:8px 10px; font-size:13px; border-radius:8px; color:#60646C; margin-bottom:2px; }
.side div.on { background:#E0E1E6; color:#1C2024; font-weight:600; }
.main { flex:1; padding:14px 12px; }
.ph { height:12px; border-radius:6px; background:#F0F0F3; margin-bottom:10px; }
</style></head><body><div class="phone">
<div class="bar"><div class="dots"><span></span><span></span><span></span></div><div class="url">jamble.com/seller/dashboard</div></div>
<div class="hdr"><div class="mark">Seller <b>Hub</b></div><div class="create"><div class="btn btn-brand"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5V12.5M1.5 7H12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Criar</div><div class="drop"><div>Agendar Live</div><div>Criar Novo Produto</div><div>Clonar de Lives Anteriores</div><div>Importar CSV</div></div></div></div>
<div class="body"><div class="side"><div class=on>Visão Geral</div><div>Lives</div><div>Catálogo</div><div>Vendas</div><div>Envios</div><div>Notas Fiscais</div><div>Carteira</div><div>Indicações</div></div><div class="main"><div class="ph" style="width:70%"></div><div class="ph" style="width:90%"></div><div class="ph" style="width:55%"></div></div></div>
</div></body></html>
