<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #F9FAFC; display: flex; justify-content: center; padding: 12px; color: #162233; }
.phone { width: 340px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 20px rgba(126,83,248,0.08); border: 1px solid #E9EAEF; overflow: hidden; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; }
.btn-brand { background: #7E53F8; color: #FFFFFF; }
.btn-secondary { background: #E9EAEF; color: #162233; }
.btn-outline { background: #FFFFFF; color: #162233; border: 1px solid #DADDE3; }
.muted { color: #6B7A92; }
.tert { color: #A0A7B7; }
.stage { height:150px; background:#111113; display:flex; align-items:center; justify-content:center; }
.cam { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.08); color:#FFFFFF; display:flex; align-items:center; justify-content:center; }
.cam svg { width:28px; height:28px; }
.sheet { padding:20px 18px 18px; }
.sheet h1 { font-size:20px; font-weight:600; line-height:28px; margin-bottom:6px; }
.sheet p { font-size:14px; line-height:20px; margin-bottom:18px; }
.stack { display:flex; flex-direction:column; gap:10px; }
.later { text-align:center; font-size:14px; font-weight:600; color:#6B7A92; padding-top:12px; }
</style></head><body><div class="phone">
<div class="stage"><div class="cam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6" width="13" height="12" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M15.5 10.5L21 7.5V16.5L15.5 13.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div></div>
<div class="sheet"><h1>Iniciar sua live?</h1><p class="muted">Quer transmitir deste dispositivo? Confira a câmera e o microfone antes de iniciar. Ao iniciar, as pessoas poderão entrar na sua live.</p>
<div class="stack"><div class="btn btn-brand">Transmitir</div><div class="btn btn-secondary">Iniciar sem transmitir</div></div><div class="later">Depois</div></div>
</div></body></html>
