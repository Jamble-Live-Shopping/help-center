# Article flow contract for understanding-listing-conditions-and-expectations.
# Concept article: per-category condition scales (server-driven).

workflow: article-v2
mode: v2_rewrite
audience: both

job_to_be_done: "Explain that item conditions depend on the listing category, list the conditions each category offers with their in-app descriptions, and help sellers pick the right one"

source_of_truth:
  # Re-verified 2026-10-14 against jamble_backend origin/main (291e133b5), iOS 5.10.1,
  # Android v5.10.0. The condition picker is server-driven: the category config lists
  # which condition values a category offers; condition.json holds titles + descriptions.
  ios_files:
    - PRODUCT/Views/SwiftUI/CreateProductView.swift
    - PRODUCT/Views/SwiftUI/ProductAttributeValuesView.swift
    - RESOURCES/Localizable.xcstrings
  backend_files:
    - src/product_attributes/configs/attributes/condition.json
    - src/product_attributes/configs/attributes/category.json
    - src/product_attributes/configs/tree.json
    - src/product_attributes/configs/categories/pokemon_cards.json
    - src/product_attributes/configs/categories/hot_wheels.json
    - src/product_attributes/configs/categories/stickers.json
    - src/product_attributes/configs/categories/funko_pop.json
    - src/product_attributes/configs/categories/clothing.json
    - src/product_attributes/configs/categories/coins.json
    - src/product_attributes/configs/categories/manga.json
    - src/product_attributes/configs/categories/games.json
    - src/product_attributes/configs/categories/others.json
    - src/services/product_service.py
  legal: []
  support_context: []

content_contract:
  # must_answer is a substring scan applied to BOTH pt-br.md and en.md.
  # pt-BR condition labels are kept verbatim (bold or plain) in the EN mirror.
  must_answer:
    - "Quase Mint"
    - "Pouco Usado"
    - "Novo com etiquetas"
    - "Flor de Cunho"
    - "Lorcana"
    - "Editar"
  forbidden_terms:
    - "auction"
    - "leilao"
    - "leilão"
  must_not_say:
    - "Condition is optional"
    - "number one cause"
    - "Products with a condition rating sell better"
    - "Mesmas opções para todas as categorias"
    - "Same options for every category"
    - "cinco condições"
    - "five conditions"

mockup_plan:
  # Wave 2 (2026-10-14): both old screens removed. The 5-tier picker no longer
  # matches any category (conditions are per category now) and the form no
  # longer places Condição between Cor and Preço. New mockups are out of scope.
  required: false
  screens: []

icons_required: []
icons_fallback_feather: false
currency_required: false

# Concept article with short, linear H2 sections. The headings form a
# self-navigating outline and a TOC would only push content below the fold
# on mobile. Disable the TOC check.
toc_required: false

risk_flags: []
resolved_decisions: []
