# Flow contract for choose-quantities-when-listing-products.
# Worker batch real-1-rerun-2 (2026-05-08).
#
# See process/templates/article-flow.yml for field documentation.
# See process/00-RUNBOOK.md for the canonical 8-phase workflow.

workflow: article-v2
mode: v2_rewrite
audience: seller_br

job_to_be_done: "Help sellers configure available stock per listing, including single-item and multi-quantity flows"

source_of_truth:
  # Re-verified 2026-10-14 against iOS tag 5.10.1, Android v5.10.0 and backend origin/main.
  # The product form is server-driven on every client (get_product_edition_fields).
  ios_files:
    - PRODUCT/Views/SwiftUI/CreateProductView.swift
    - PRODUCT/Views/SwiftUI/Components/CreateProductQuantitySectionView.swift
    - PRODUCT/Views/SwiftUI/Components/CreateProductToggleSectionView.swift
    - LIVE_SHOPPING/Checkout/View/ShowCheckoutView.swift
    - CART/Views/CartItemRow.swift
    - RESOURCES/Localizable.xcstrings
  backend_files:
    - src/services/product_service.py
    - src/utils/purchase_intent_manager.py
    - src/schemas/cart.py
    - src/entities/purchase_intent.py
  legal: []
  support_context: []

content_contract:
  # Wave 2 rewrite (2026-10-14): the max quantity (1.000) is a code value the
  # form never displays as text, so the article stays general and no longer
  # has to say it. Lote and pre-offers are the two rules sellers ask about.
  must_answer:
    - "Lote"
    - "Unidades do lote"
    - "Ativar pré-ofertas"
    - "Comprar Agora"
  forbidden_terms:
    - "regex:\\bauction\\b"
    - "regex:\\bleil[aã]o\\b"
    - "pre-ofertas"
    - "regex:\\bPre-Bid\\b"
    - "1.000"
    - "1,000"
  must_not_say:
    - "Verified badges"
    - "Jamble Prime"
    - "starts automatically"
    - "começa automaticamente"

mockup_plan:
  # No mockup in wave 2: the old stepper and pre-offer error toast screens no
  # longer match the server-driven form (the pre-offer toggle is now hidden
  # when quantity > 1, there is no error toast). New mockups are out of scope.
  required: false
  screens: []

icons_required: []
icons_fallback_feather: false

currency_required: false

toc_required: false

risk_flags: []
resolved_decisions: []
